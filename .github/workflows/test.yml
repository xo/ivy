name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The module that a user imports is pure Go (D1), so each runner tests it
  # with cgo off, as a program that imports it builds. CI does not run the
  # test module in test/, which needs the oracles (D13).
  test:
    name: test ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: linux/amd64, os: ubuntu-latest}
          - {name: linux/arm64, os: ubuntu-24.04-arm}
          - {name: macos/arm64, os: macos-latest}
          - {name: windows/amd64, os: windows-latest}
    env:
      CGO_ENABLED: "0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # gofmt and the linters give the same answer on every runner, so one
      # runner runs them.
      - name: Check the format
        if: ${{ matrix.name == 'linux/amd64' }}
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Lint
        if: ${{ matrix.name == 'linux/amd64' }}
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.15.0
          golangci-lint run ./...

      - name: Vet
        run: go vet ./...

      - name: Test without cgo
        run: go test -count=1 ./...

      # -race needs cgo. A document is safe for concurrent use (D11).
      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 ./...

      # Each SIMD path has a scalar path, and both builds must pass (D9).
      - name: Test the SIMD build
        if: ${{ matrix.name == 'linux/amd64' }}
        env:
          GOEXPERIMENT: simd
        run: go test -count=1 ./...

      # The fonts of D24 are a module of their own.
      - name: Test the fonts module
        if: ${{ matrix.name == 'linux/amd64' }}
        working-directory: fonts
        run: |
          go vet ./...
          go test -count=1 ./...
          golangci-lint run ./...

  # A program that imports ivy builds for every target of Go. This builds the
  # packages for targets that have no runner.
  cross:
    name: build for other targets
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: |
          for t in freebsd/amd64 linux/386 linux/arm linux/riscv64 \
            linux/s390x windows/386 js/wasm wasip1/wasm; do
            echo "$t"
            GOOS=${t%/*} GOARCH=${t#*/} go build ./...
          done
